name: Realtime Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - "realtime-v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip pytest ruff
      - name: Static checks
        run: ruff check realtime_orchestrator tests/test_realtime_orchestrator.py
      - name: Tests
        run: pytest -q tests/test_realtime_orchestrator.py
      - name: Release summary
        run: |
          echo "Release gate passed for ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
