name: Realtime Agent Dispatch

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows:
      - Realtime CI
      - Realtime Nightly Evaluation
    types: [completed]
  repository_dispatch:
    types: [realtime.run, realtime.audit, realtime.replay]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to execute
        required: true
        default: audit

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: realtime-dispatch-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      ${{ github.event_name != 'issue_comment' ||
          startsWith(github.event.comment.body, '/realtime ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip
      - name: Dispatch
        env:
          PYTHONPATH: .
        run: python -m realtime_orchestrator.runner
      - name: Record control-plane checkpoint
        if: always()
        run: |
          {
            echo "## Realtime dispatch"
            echo "- event: ${{ github.event_name }}"
            echo "- action: ${{ github.event.action }}"
            echo "- run: ${{ github.run_id }}"
            echo "- sha: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
