name: Realtime Weekly Audit

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: realtime-weekly-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install --upgrade pip pytest ruff
      - name: Execute verifier suite
        run: pytest -q tests/test_realtime_orchestrator.py
      - name: Create audit summary
        if: always()
        run: |
          {
            echo "## Weekly independent-audit checkpoint"
            echo "Commit: ${{ github.sha }}"
            echo "Workflow run: ${{ github.run_id }}"
            echo ""
            echo "This checkpoint is intentionally independent of training reward."
          } >> "$GITHUB_STEP_SUMMARY"
